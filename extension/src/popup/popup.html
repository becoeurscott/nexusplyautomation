<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px; margin: 0; padding: 16px; background: #020817; color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 15px; }
      p { margin: 0 0 12px; font-size: 12px; color: #94a3b8; line-height: 1.5; }
      input {
        width: 100%; box-sizing: border-box; padding: 8px; font-size: 12px;
        background: rgba(255,255,255,.05); color: #f5f5f5;
        border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      }
      button {
        width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px;
        background: #0a63f4; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      .status { margin-top: 10px; font-size: 12px; }
      .ok { color: #34d399; }
      .err { color: #f87171; }
      a { color: #73b4ff; }
    </style>
  </head>
  <body>
    <h1>NexusPly</h1>
    <p>
      Paste the token from
      <a href="https://nexusplyautomation.com/app/settings" target="_blank">Settings</a>
      to connect this extension to your workspace.
    </p>
    <input id="token" type="password" placeholder="nxp_…" autocomplete="off" />
    <button id="save">Connect</button>
    <button id="clear" style="background: rgba(255,255,255,.08)">Disconnect</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
